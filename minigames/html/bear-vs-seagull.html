<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bear vs Seagull</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout: one 4:5 game screen (matches Episode Night's frame): the harbor bar arena on a canvas, three thumb buttons along the bottom. Single warm-night look taken from the bar art. */
:root {
  --night: #1a1520;
  --frame: #2a1d1a;
  --amber: #ffb347;
  --amber-deep: #c8742a;
  --navy: #3d5a8c;
  --coat: #8fb4ff;
  --red: #e8503f;
  --cream: #fff1d6;
  --display: "Bungee", "Arial Black", Impact, sans-serif;
  --body: "Rubik", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--cream); font-family: var(--body);
  display: grid; place-items: center; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px; box-sizing: border-box;
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
}
#screen {
  position: relative; width: min(100%, 480px, calc((100dvh - 24px) * 0.8));
  aspect-ratio: 4 / 5; max-width: 100%;
  border-radius: 14px; overflow: hidden; background: var(--frame);
  box-shadow: 0 0 0 4px var(--frame), 0 0 0 7px var(--amber-deep);
}
canvas { display: block; width: 100%; height: 100%; }
#pad {
  position: absolute; left: 0; right: 0; bottom: 0; height: 20%;
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 6px 10px 10px;
  background: linear-gradient(transparent, rgba(26,21,32,.85) 35%);
}
#pad button {
  font-family: var(--display); font-size: clamp(13px, 4.2vw, 19px); letter-spacing: .04em;
  border: 0; border-radius: 12px; color: var(--night); cursor: pointer;
  box-shadow: 0 5px 0 rgba(0,0,0,.5); transition: transform .06s, filter .2s;
  touch-action: none;
}
#pad button:active, #pad button.down { transform: translateY(4px); box-shadow: 0 1px 0 rgba(0,0,0,.5); }
#pad button:focus-visible { outline: 3px solid var(--cream); outline-offset: 2px; }
#pad small { display: block; font-family: var(--body); font-weight: 700; font-size: 10px; letter-spacing: .08em; opacity: .65; margin-top: 2px; }
#bBlock { background: var(--coat); }
#bPunch { background: var(--red); color: var(--cream); }
#bSuper { background: var(--amber); }
#bSuper:disabled { filter: grayscale(1) brightness(.5); cursor: default; }
#bSuper.ready { animation: glow .7s ease-in-out infinite alternate; }
@keyframes glow { to { box-shadow: 0 5px 0 rgba(0,0,0,.5), 0 0 22px var(--amber); filter: brightness(1.15); } }
#overlay {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 14px; text-align: center;
  background: rgba(26,21,32,.72); padding: 24px;
}
#overlay h1 { font-family: var(--display); font-weight: 400; margin: 0; font-size: clamp(30px, 10vw, 48px); line-height: 1; color: var(--amber); text-wrap: balance; text-shadow: 0 4px 0 #000; }
#overlay p { margin: 0; font-size: 15px; line-height: 1.45; max-width: 30ch; justify-self: center; }
#overlay .keys { font-size: 12px; opacity: .7; }
#overlay button {
  justify-self: center; font-family: var(--display); font-size: 20px; padding: 12px 26px;
  background: var(--amber); color: var(--night); border: 0; border-radius: 12px; cursor: pointer;
  box-shadow: 0 5px 0 var(--amber-deep);
}
#overlay button:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--amber-deep); }
#overlay button:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { #bSuper.ready { animation: none; box-shadow: 0 0 0 3px var(--cream); } }
</style>

<div id="screen">
  <canvas id="c" width="640" height="800"></canvas>
  <div id="pad">
    <button id="bBlock" aria-label="Block (hold)">BLOCK<small>HOLD</small></button>
    <button id="bSuper" disabled aria-label="Super move">SUPER<small id="superPct">0%</small></button>
    <button id="bPunch" aria-label="Punch">PUNCH<small>TAP</small></button>
  </div>
  <div id="overlay">
    <h1 id="ovTitle">Bear vs Seagull</h1>
    <p id="ovText">The Seagull just kicked in the door looking for trouble. Punch him, block his attacks, and land enough hits to charge your Ground Pound.</p>
    <p class="keys" id="ovKeys">Keys: J punch · K hold to block · L super</p>
    <button id="ovBtn">FIGHT!</button>
  </div>
</div>

   to the parent window and fires a "minigame-complete" event on window, so the episode
   can branch to the Bear-wins or Seagull-wins video.
   Opened on its own (not inside Episode Night), a loss offers Try Again instead. */
const EMBEDDED = window.parent && window.parent !== window;
function reportResult(result) {
  const msg = { type: "minigame-complete", id: CONFIG.id, result };
  try { if (EMBEDDED) window.parent.postMessage(msg, "*"); } catch (e) {}
  window.dispatchEvent(new CustomEvent("minigame-complete", { detail: msg }));
}
function reportWin() { reportResult("win"); }

/* ---------- sprites: h = drawn height in game units, ax = where the body center sits (0–1 of width) ---------- */
const SPR = {
  bg: {}, bear_idle: { h: 126, ax: .5 }, bear_punch: { h: 124, ax: .38 }, bear_jump: { h: 100, ax: .5 },
  bear_slam: { h: 136, ax: .5 }, gull_idle: { h: 134, ax: .5 }, gull_punch: { h: 128, ax: .62 }, gull_dive: { h: 104, ax: .5 },
};
let loaded = 0;
for (const k in SPR) { const im = new Image(); im.onload = () => loaded++; im.src = ART[k]; SPR[k].img = im; }

const cv = document.getElementById("c"), g = cv.getContext("2d");
const W = 320, H = 400, FLOOR = 306, BEAR_X = 80, GULL_X = 242;
const $ = id => document.getElementById(id);
const ov = $("overlay"), bSuper = $("bSuper");
const rand = (a, b) => a + Math.random() * (b - a);
const lerp = (a, b, k) => a + (b - a) * k;

let S;
function reset() {
  S = {
    phase: "ready", t: 0, shake: 0, flash: 0, super: 0,
    bear: { hp: CONFIG.bearHP, meter: 0, act: "idle", t: 0, blocking: false, hurt: 0, x: BEAR_X, y: FLOOR, kb: 0 },
    gull: { hp: CONFIG.gullHP, st: "idle", t: rand(...CONFIG.idleTime), hurt: 0, x: GULL_X, y: FLOOR, move: "kick", hitDone: false, kb: 0, ko: 0 },
    pops: [], parts: [], rings: [],
  };
  updatePad();
}

/* ---------- input ---------- */
let blockHeld = false;
function punch() {
  const b = S.bear;
  if (S.phase !== "fight" || b.act !== "idle" || blockHeld) return;
  b.act = "punch"; b.t = 0; b.resolved = false;
}
function superMove() {
  const b = S.bear;
  if (S.phase !== "fight" || b.meter < 100 || b.act === "super") return;
  b.act = "super"; b.t = 0; b.resolved = false; b.meter = 0;
  S.super = 1.4; updatePad();
}
function setBlock(on) { blockHeld = on; $("bBlock").classList.toggle("down", on); }

$("bBlock").addEventListener("pointerdown", e => { e.preventDefault(); e.currentTarget.setPointerCapture?.(e.pointerId); setBlock(true); });
["pointerup", "pointercancel", "lostpointercapture"].forEach(n => $("bBlock").addEventListener(n, () => setBlock(false)));
$("bPunch").addEventListener("pointerdown", e => { e.preventDefault(); punch(); });
bSuper.addEventListener("pointerdown", e => { e.preventDefault(); superMove(); });
addEventListener("keydown", e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === "j" || k === "a") punch();
  if (k === "k" || k === "s") setBlock(true);
  if (k === "l" || k === " ") { e.preventDefault(); superMove(); }
  if (k === "enter" && !ov.hidden && !$("ovBtn").hidden) $("ovBtn").click();
});
addEventListener("keyup", e => { const k = e.key.toLowerCase(); if (k === "k" || k === "s") setBlock(false); });

$("ovBtn").addEventListener("click", () => {
  if (S.phase === "win") {
    reportWin();
    $("ovTitle").textContent = "Bar's safe!"; $("ovText").textContent = "On to the next part of the episode."; $("ovBtn").hidden = true;
    return;
  }
  if (S.phase === "lose" && EMBEDDED) {
    reportResult("lose");
    $("ovBtn").hidden = true;
    return;
  }
  reset(); ov.hidden = true; S.phase = "countdown"; S.t = 0;
});

function updatePad() {
  const m = Math.round(S.bear.meter);
  $("superPct").textContent = m >= 100 ? "READY!" : m + "%";
  bSuper.disabled = m < 100;
  bSuper.classList.toggle("ready", m >= 100);
}

/* ---------- effects ---------- */
function pop(text, x, y, color) { S.pops.push({ text, x, y, color, t: 0 }); }
function feathers(x, y, n) {
  for (let i = 0; i < n; i++) S.parts.push({ x, y, vx: rand(-110, 110), vy: rand(-150, -30), r: rand(0, 6.28), vr: rand(-6, 6), t: 0, life: rand(.7, 1.2), color: i % 3 ? "#fff1d6" : "#e9dcc0" });
}

/* ---------- logic ---------- */
function hitGull(dmg, label) {
  const s = S.gull;
  s.hp = Math.max(0, s.hp - dmg); s.hurt = .35; s.st = "hurt"; s.t = .35; s.kb = dmg > 20 ? 30 : 12;
  S.shake = Math.max(S.shake, dmg > 20 ? 14 : 5);
  pop(label, s.x, FLOOR - 165, "#fff1d6");
  feathers(s.x, FLOOR - 100, dmg > 20 ? 20 : 7);
  if (s.hp <= 0) { S.phase = "win"; S.t = 0; setBlock(false); }
}

function step(dt) {
  S.t += dt;
  S.shake = Math.max(0, S.shake - dt * 30);
  S.flash = Math.max(0, S.flash - dt * 3);
  S.super = Math.max(0, S.super - dt);
  S.pops = S.pops.filter(p => (p.t += dt) < 0.9);
  S.parts = S.parts.filter(p => { p.t += dt; p.vy += 260 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; return p.t < p.life; });
  S.rings = S.rings.filter(r => (r.t += dt) < 0.5);

  const b = S.bear, s = S.gull;
  b.hurt = Math.max(0, b.hurt - dt); s.hurt = Math.max(0, s.hurt - dt);
  b.kb = Math.max(0, b.kb - dt * 80); s.kb = Math.max(0, s.kb - dt * 80);

  if (S.phase === "countdown") { if (S.t > 2.2) { S.phase = "fight"; S.t = 0; } return; }
  if (S.phase === "win" || S.phase === "lose") {
    if (S.phase === "win") s.ko = Math.min(1, s.ko + dt * 2.5);
    s.x = lerp(s.x, GULL_X, dt * 4); s.y = lerp(s.y, FLOOR, dt * 8);
    if (S.t > 1.3 && ov.hidden) showEnd();
    return;
  }
  if (S.phase !== "fight") return;

  /* bear */
  b.blocking = blockHeld && b.act === "idle";
  if (b.act === "punch") {
    b.t += dt;
    if (!b.resolved && b.t > CONFIG.punchTime * 0.35) {
      b.resolved = true;
      if (s.st === "guard") { pop("GUARD!", s.x, FLOOR - 165, "#8fb4ff"); S.shake = 2; }
      else if (s.st === "strike") { /* mid-attack, out of reach */ }
      else {
        const stunned = s.st === "stunned";
        hitGull(stunned ? CONFIG.stunnedPunchDamage : CONFIG.punchDamage, stunned ? "CRUNCH!" : s.st === "windup" ? "INTERRUPT!" : "BOP!");
        b.meter = Math.min(100, b.meter + CONFIG.meterPerHit); updatePad();
      }
    }
    if (b.t >= CONFIG.punchTime) b.act = "idle";
  } else if (b.act === "super") {
    b.t += dt;
    // Ground Pound: leap up (0–.4), slam down (.4–.55), impact, hold
    if (b.t < 0.4) b.y = FLOOR - Math.sin(b.t / 0.4 * Math.PI / 2) * 120;
    else if (b.t < 0.55) b.y = FLOOR - 120 * (1 - (b.t - 0.4) / 0.15);
    else b.y = FLOOR;
    if (!b.resolved && b.t >= 0.55) {
      b.resolved = true; S.flash = 1; S.shake = 16;
      S.rings.push({ t: 0 });
      hitGull(CONFIG.superDamage, "BOOM!");
    }
    if (b.t > 1.2) { b.act = "idle"; b.y = FLOOR; }
  }
  if (S.phase !== "fight") return;

  /* seagull AI */
  const life = s.hp / CONFIG.gullHP;
  const windup = CONFIG.windupTime[1] + (CONFIG.windupTime[0] - CONFIG.windupTime[1]) * life;
  s.t -= dt;
  if (b.act === "super" && (s.st === "windup" || s.st === "strike")) { s.st = "idle"; s.t = 1.4; }

  if (s.t <= 0) {
    switch (s.st) {
      case "idle":
        if (Math.random() < CONFIG.guardChance) { s.st = "guard"; s.t = rand(.7, 1.1); }
        else { s.st = "windup"; s.t = windup; s.move = Math.random() < .5 ? "kick" : "punch"; }
        break;
      case "windup": s.st = "strike"; s.t = s.move === "kick" ? 0.32 : 0.22; s.dur = s.t; s.hitDone = false; break;
      case "strike": s.st = "retreat"; s.t = 0.35; break;
      default: s.st = "idle"; s.t = rand(...CONFIG.idleTime) * (0.6 + 0.4 * life);
    }
  }

  const targetX = BEAR_X + 70;
  if (s.st === "strike") {
    const k = 1 - s.t / s.dur;
    s.x = lerp(GULL_X, targetX, Math.min(1, k * 1.2));
    s.y = s.move === "kick" ? FLOOR - Math.sin(k * Math.PI) * 70 + k * 20 : FLOOR;
    if (!s.hitDone && k > 0.78) {
      s.hitDone = true;
      if (b.blocking) {
        s.st = "stunned"; s.t = CONFIG.stunTime; s.y = FLOOR;
        pop("BLOCKED!", b.x, FLOOR - 160, "#8fb4ff"); S.shake = 4; feathers(s.x - 30, FLOOR - 90, 4);
      } else if (b.act !== "super") {
        b.hp = Math.max(0, b.hp - CONFIG.gullHitDamage); b.hurt = .4; b.kb = 14; S.shake = 8;
        pop(s.move === "kick" ? "DIVE KICK!" : "WHAM!", b.x, FLOOR - 160, "#e8503f");
        if (b.act === "punch") b.act = "idle";
        if (b.hp <= 0) { S.phase = "lose"; S.t = 0; setBlock(false); }
      }
    }
  } else if (s.st === "stunned") {
    s.x = lerp(s.x, targetX + 10, dt * 6); s.y = FLOOR;
  } else {
    s.x = lerp(s.x, GULL_X, dt * 6); s.y = lerp(s.y, FLOOR, dt * 10);
  }
}

function showEnd() {
  ov.hidden = false; $("ovKeys").hidden = true; $("ovBtn").hidden = false;
  if (S.phase === "win") {
    $("ovTitle").textContent = "Bear wins!";
    $("ovText").textContent = "The Seagull's out cold on the floorboards. Drinks are on the house.";
    $("ovBtn").textContent = "CONTINUE";
  } else {
    $("ovTitle").textContent = "Knocked out!";
    $("ovText").textContent = EMBEDDED
      ? "The Seagull got the better of Bear this time."
      : "Tip: hold Block when the Seagull flashes \"!\", then punch him while he's dizzy.";
    $("ovBtn").textContent = EMBEDDED ? "CONTINUE" : "TRY AGAIN";
  }
  $("ovBtn").focus();
}

/* ---------- drawing (game units: 320×400, canvas is 2× for crisp art) ---------- */
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function circle(x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fill(); }

// draw sprite with feet at (x, y); sy squashes vertically
function sprite(key, x, y, opt = {}) {
  const sp = SPR[key], im = sp.img; if (!im.complete || !im.naturalWidth) return;
  const h = sp.h * (opt.scale || 1), w = h * im.naturalWidth / im.naturalHeight, sy = opt.sy || 1;
  g.save(); g.translate(x, y);
  if (opt.rot) g.rotate(opt.rot);
  if (opt.alpha != null) g.globalAlpha = opt.alpha;
  g.drawImage(im, -w * sp.ax, -h * sy, w, h * sy);
  g.restore();
}
function shadow(x, w) { g.fillStyle = "rgba(20,10,8,.45)"; g.beginPath(); g.ellipse(x, FLOOR - 2, w, 7, 0, 0, 6.283); g.fill(); }

function drawBear() {
  const b = S.bear, x = b.x - b.kb, blink = b.hurt > 0 && (b.hurt * 20 | 0) % 2 ? .35 : 1;
  shadow(x, 46 * (1 - (FLOOR - b.y) / 260));
  const breathe = 1 + Math.sin(S.t * 4) * 0.012;
  if (b.act === "punch") {
    const k = Math.sin(Math.min(1, b.t / CONFIG.punchTime) * Math.PI);
    sprite("bear_punch", x + k * 22, b.y, { alpha: blink });
  } else if (b.act === "super") {
    sprite(b.t < 0.55 ? "bear_jump" : "bear_slam", x + (b.t < .55 ? 0 : 6), b.y, {});
  } else if (b.blocking) {
    sprite("bear_idle", x - 4, b.y, { sy: 0.94, alpha: blink });
    g.strokeStyle = "rgba(143,180,255,.9)"; g.lineWidth = 4; g.beginPath(); g.arc(x + 20, b.y - 70, 66, -1.0, 1.0); g.stroke();
    g.strokeStyle = "rgba(143,180,255,.35)"; g.lineWidth = 10; g.stroke();
  } else {
    sprite("bear_idle", x, b.y, { sy: breathe, alpha: blink });
  }
}

function drawGull() {
  const s = S.gull, x = s.x + s.kb, blink = s.hurt > 0 && (s.hurt * 20 | 0) % 2 ? .35 : 1;
  shadow(x, 44 * (1 - (FLOOR - s.y) / 260));
  if (S.phase === "win") { sprite("gull_idle", x + s.ko * 20, s.y, { rot: s.ko * 1.45 }); return; }
  if (s.st === "strike") {
    sprite(s.move === "kick" ? "gull_dive" : "gull_punch", x, s.y, {});
  } else if (s.st === "windup") {
    sprite("gull_idle", x + 6, s.y, { sy: 0.9 });
    if (((S.t * 10) | 0) % 2) {
      g.font = "30px Bungee, sans-serif"; g.textAlign = "center";
      g.fillStyle = "#000"; g.fillText("!", x + 2, s.y - 150); g.fillStyle = "#e8503f"; g.fillText("!", x, s.y - 152);
    }
  } else if (s.st === "stunned") {
    sprite("gull_idle", x, s.y, { rot: Math.sin(S.t * 8) * 0.06 });
    for (let i = 0; i < 3; i++) { const a = S.t * 5 + i * 2.09; circle(x + Math.cos(a) * 24, s.y - 150 + Math.sin(a) * 7, 4, "#ffb347"); }
  } else if (s.st === "guard") {
    sprite("gull_idle", x + 4, s.y, { sy: 0.95, alpha: blink });
    g.strokeStyle = "rgba(255,241,214,.85)"; g.lineWidth = 4; g.beginPath(); g.arc(x - 20, s.y - 72, 64, Math.PI - 1.0, Math.PI + 1.0); g.stroke();
  } else {
    sprite("gull_idle", x, s.y, { sy: 1 + Math.sin(S.t * 4 + 1) * 0.012, alpha: blink });
  }
}

function bar(x, y, w, frac, color, label, right) {
  g.fillStyle = "rgba(10,6,8,.8)"; rr(x - 3, y - 3, w + 6, 18, 6); g.fill();
  g.fillStyle = "#4a2a26"; rr(x, y, w, 12, 3); g.fill();
  g.fillStyle = frac > 0.3 ? color : "#e8503f";
  const fw = w * Math.max(0, frac);
  if (fw > 0) { rr(right ? x + w - fw : x, y, fw, 12, 3); g.fill(); }
  g.font = "11px Bungee, sans-serif"; g.textAlign = right ? "right" : "left";
  g.fillStyle = "#000"; g.fillText(label, (right ? x + w : x) + 1, y + 30);
  g.fillStyle = "#fff1d6"; g.fillText(label, right ? x + w : x, y + 29);
}

function drawHUD() {
  bar(12, 12, 128, S.bear.hp / CONFIG.bearHP, "#ffb347", "BEAR", false);
  bar(180, 12, 128, S.gull.hp / CONFIG.gullHP, "#8fb4ff", "SEAGULL", true);
  g.font = "14px Bungee, sans-serif"; g.textAlign = "center";
  g.fillStyle = "#000"; g.fillText("VS", 161, 25); g.fillStyle = "#fff1d6"; g.fillText("VS", 160, 24);
  // super meter under the bear's bar
  g.fillStyle = "rgba(10,6,8,.8)"; rr(10, 47, 94, 10, 4); g.fill();
  g.fillStyle = S.bear.meter >= 100 && ((S.t * 6) | 0) % 2 ? "#fff1d6" : "#ffb347";
  if (S.bear.meter > 0) { rr(12, 49, 90 * S.bear.meter / 100, 6, 3); g.fill(); }
}

function bigText(t, size, color) {
  g.font = size + "px Bungee, sans-serif"; g.textAlign = "center";
  g.fillStyle = "#000"; g.fillText(t, 162, 132); g.fillStyle = color; g.fillText(t, 160, 128);
}

function draw() {
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.save();
  if (S.shake) g.translate(rand(-S.shake, S.shake), rand(-S.shake, S.shake));
  const bg = SPR.bg.img;
  if (bg.complete && bg.naturalWidth) g.drawImage(bg, -8, -8, W + 16, H + 16); else { g.fillStyle = "#2a1d1a"; g.fillRect(0, 0, W, H); }
  for (const r of S.rings) {
    const k = r.t / 0.5; g.strokeStyle = `rgba(255,179,71,${1 - k})`; g.lineWidth = 6 * (1 - k) + 1;
    g.beginPath(); g.ellipse(S.bear.x + 20, FLOOR, 30 + k * 220, 8 + k * 20, 0, 0, 6.283); g.stroke();
  }
  drawGull(); drawBear();
  for (const p of S.parts) { g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.globalAlpha = 1 - p.t / p.life; g.fillStyle = p.color; g.beginPath(); g.ellipse(0, 0, 7, 2.6, 0, 0, 6.283); g.fill(); g.restore(); }
  for (const p of S.pops) {
    g.globalAlpha = 1 - p.t / 0.9; g.font = "16px Bungee, sans-serif"; g.textAlign = "center";
    const y = p.y - p.t * 40;
    g.fillStyle = "#000"; g.fillText(p.text, p.x + 2, y + 2); g.fillStyle = p.color; g.fillText(p.text, p.x, y);
    g.globalAlpha = 1;
  }
  g.restore();
  if (S.flash) { g.fillStyle = `rgba(255,241,214,${S.flash * 0.75})`; g.fillRect(0, 0, W, H); }
  if (S.super > 0.7) bigText("GROUND POUND!", 24, "#ffb347");
  drawHUD();
  if (S.phase === "countdown") bigText(S.t < 1.3 ? "READY…" : "FIGHT!", 40, S.t < 1.3 ? "#fff1d6" : "#e8503f");
  if (S.phase === "win" && S.t < 1.3) bigText("K.O.!", 54, "#ffb347");
  if (S.phase === "lose" && S.t < 1.3) bigText("OUCH!", 54, "#e8503f");
}

let last = 0;
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000 || 0); last = ts;
  step(dt); draw(); requestAnimationFrame(frame);
}
reset();
requestAnimationFrame(frame);
</script>
